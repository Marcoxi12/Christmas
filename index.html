<script>
/* ── ANIMATED BACKGROUND ── */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, flakes = [];

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function makeFlake() {
  return {
    x: Math.random() * W,
    y: Math.random() * H - H,
    r: Math.random() * 1.8 + 0.3,
    speed: Math.random() * 0.6 + 0.2,
    drift: (Math.random() - 0.5) * 0.3,
    opacity: Math.random() * 0.5 + 0.1,
  };
}

function initFlakes() {
  flakes = Array.from({ length: 280 }, makeFlake);
  flakes.forEach(f => f.y = Math.random() * H);
}

function tickSnow() {
  ctx.clearRect(0, 0, W, H);
  flakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,215,200,${f.opacity})`;
    ctx.fill();
    f.y += f.speed;
    f.x += f.drift;
    if (f.y > H + 4) { Object.assign(f, makeFlake()); f.y = -4 }
  });
  const vis = flakes.filter(f => f.y > 0 && f.y < H).length;
  const el = document.getElementById('snow-count');
  if (el) el.textContent = `❄ ${vis} snowflakes`;
  requestAnimationFrame(tickSnow);
}

resizeCanvas();
initFlakes();
tickSnow();
window.addEventListener('resize', () => { resizeCanvas(); initFlakes() });

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', () => goTo('intro'));

    desc: "fly in, check into a spot in lodo, wake up to snow with the rockies right there. ski day trip if you want it. bars and restaurants at night. three days goes fast but it feels like you actually went somewhere.",

    why: "you want scenery and a real winter — denver's the move. waking up to snow and the rockies behind the skyline is a different kind of christmas",
  },
  Chicago: {
    photo: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1280&q=85&fit=crop",
    thumb: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=400&q=75&fit=crop",
    meta: "~2.5h flight  ·  20–38°F  ·  $$$",
    desc: "real german christmas market in millennium park, the magnificent mile covered in lights, deep dish that actually lives up to it, architecture everywhere you look. chicago goes crazy at christmas and nobody talks about it enough.",
    tags: ["🎄 christkindlmarket", "🏛️ architecture", "🍕 deep dish", "❄️ full christmas energy", "🌃 magnificent mile"],
    why: "real christmas market, stunning city, great food — chicago goes hard at the holidays. feels more like christmas than anywhere else on this list",
  },
  "New York": {
    photo: "https://images.unsplash.com/photo-1534430480872-3498386e7856?w=1280&q=85&fit=crop",
    thumb: "https://images.unsplash.com/photo-1534430480872-3498386e7856?w=400&q=75&fit=crop",
    meta: "~3h flight  ·  32–45°F  ·  $$$$",
    desc: "bryant park ice rink friday night, 5th ave windows saturday, diner breakfast before the flight home. three days in nyc at christmas hits different.",
    tags: ["🗽 iconic", "❄️ real winter", "🍕 best food scene", "🎭 culture everywhere"],
    why: "you want the real christmas energy — nyc is the only city where that's actually true fr",
  },
  Nashville: {
    photo: "https://images.unsplash.com/photo-1545919982-f050a3a042e4?w=1280&q=85&fit=crop",
    thumb: "https://images.unsplash.com/photo-1545919982-f050a3a042e4?w=400&q=75&fit=crop",
    meta: "~1.5h flight  ·  35–50°F  ·  $$",
    desc: "broadway friday night, hot chicken saturday, rooftop before the flight home. short flight, easy weekend, money goes further.",
    tags: ["🎵 live music", "🍗 hot chicken", "🕺 nightlife", "🌙 never sleeps"],
    why: "live music, late nights, great food — and it's half the price of nyc. nashville is built for exactly this kind of trip",
  },
  Atlanta: {
    photo: "https://images.unsplash.com/photo-1575917649705-5b59aaa12e6b?w=1280&q=85&fit=crop",
    thumb: "https://images.unsplash.com/photo-1575917649705-5b59aaa12e6b?w=400&q=75&fit=crop",
    meta: "~2h flight  ·  38–55°F  ·  $$",
    desc: "direct flight, great food, easy to get around. no chaos, no overcrowding. solid weekend, good food, good vibes.",
    tags: ["🍑 southern food", "🌆 neighborhoods", "✈️ easy direct", "😌 low-key"],
    why: "easy flight, great food, no stress — atlanta is the underrated pick that still delivers",
  },
  "New Orleans": {
    photo: "https://images.unsplash.com/photo-1570197571499-166b36435e9f?w=1280&q=85&fit=crop",
    thumb: "https://images.unsplash.com/photo-1570197571499-166b36435e9f?w=400&q=75&fit=crop",
    meta: "~1h flight  ·  48–62°F  ·  $$",
    desc: "one hour from houston, french quarter decorated for christmas, best food in america. three days in nola and you eat and drink better than anywhere else on this list.",
    tags: ["🎷 jazz everywhere", "🦞 best food in america", "🎉 always a party", "🌶️ the vibe"],
    why: "the food, the jazz, the french quarter at christmas — nola is unmatched for vibes tbh",
  },
};

const QS = [
  {
    text: "what kind of weather do you want",
    hint: "we're escaping houston either way",
    opts: [
      { l: "cold cold — snow, coat, the real thing", v: "cold" },
      { l: "crisp — cool enough to feel like the holidays", v: "mild" },
      { l: "mild — i run cold, 50s is plenty", v: "warm" },
    ]
  },
  {
    text: "the trip was perfect. what made it",
    hint: "pick the one thing you'd be most upset about missing",
    opts: [
      { l: "the food — ate through every neighborhood", v: "food" },
      { l: "the nights out — closed down more than one spot", v: "nightlife" },
      { l: "the scenery — views, air, actually being outside", v: "outdoors" },
      { l: "the culture — museums, history, architecture", v: "culture" },
      { l: "the music — live sets, jazz, honky tonks", v: "music" },
    ]
  },
  {
    text: "how packed is your ideal itinerary",
    hint: null,
    opts: [
      { l: "max — new spot every few hours, sleep when we're home", v: "packed" },
      { l: "balanced — a couple things a day, no rushing", v: "balanced" },
      { l: "easy — good food, slow mornings, no real schedule", v: "relaxed" },
    ]
  },
  {
    text: "pick your travel personality",
    hint: null,
    opts: [
      { l: "i want photos that make people ask where we went", v: "scenic" },
      { l: "i will find the most hyped restaurant and we're going", v: "foodie" },
      { l: "i want a story to tell when we get back", v: "social" },
      { l: "i want to actually come back rested", v: "chill" },
    ]
  },
  {
    text: "new york is on the list. be honest",
    hint: "best christmas city. also the most expensive",
    opts: [
      { l: "i want it — we'll figure out the budget", v: "nyc_yes" },
      { l: "lowkey yes but... probably not this time", v: "nyc_maybe" },
      { l: "skip it, i want somewhere different", v: "nyc_no" },
    ]
  },
  {
    text: "last one — pick the vibe",
    hint: null,
    opts: [
      { l: "big city, tall buildings, always something happening", v: "bigcity" },
      { l: "somewhere with a music scene that actually goes", v: "music_scene" },
      { l: "somewhere with a backdrop — scenery, views, nature", v: "nature" },
      { l: "somewhere i'll be thinking about the food for months", v: "food_obsessed" },
    ]
  },
];

let curQ = 0, answers = {}, selVal = null, ranked = [];

/* ── ROUTING ── */
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + id).classList.add('active');
  if (id === 'question') renderQ();
}

function restart() {
  curQ = 0; answers = {}; selVal = null;
  document.getElementById('s-result').scrollTop = 0;
  goTo('intro');
}

/* ── QUESTION ── */
function renderQ() {
  const q = QS[curQ];
  const total = QS.length;

  const dots = document.getElementById('q-dots');
  dots.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'q-prog-dot' + (i < curQ ? ' done' : i === curQ ? ' active' : '');
    dots.appendChild(d);
  }

  document.getElementById('q-num-label').textContent = `${String(curQ+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
  document.getElementById('q-heading').textContent = q.text;
  const hint = document.getElementById('q-hint');
  hint.textContent = q.hint || '';
  hint.style.display = q.hint ? '' : 'none';
  document.getElementById('q-count-label').textContent = `${total - curQ - 1} left`;

  selVal = null;
  const nb = document.getElementById('q-next');
  nb.classList.remove('ready');
  nb.textContent = '';
  nb.innerHTML = (curQ === total - 1 ? 'see results' : 'next') + ' <span class="q-next-arrow"></span>';

  const list = document.getElementById('q-options');
  list.innerHTML = '';
  q.opts.forEach((o, i) => {
    const el = document.createElement('div');
    el.className = 'q-opt';
    el.innerHTML = `<span class="q-opt-index">${String.fromCharCode(65+i)}</span><span class="q-opt-label">${o.l}</span><span class="q-opt-check"></span>`;
    el.onclick = () => {
      list.querySelectorAll('.q-opt').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selVal = o.v;
      document.getElementById('q-next').classList.add('ready');
    };
    list.appendChild(el);
  });
}

function nextQ() {
  if (!selVal) return;
  answers[`q${curQ}`] = selVal;
  curQ++;
  if (curQ < QS.length) {
    renderQ();
  } else {
    ranked = scoreAndRig(answers);
    buildChoose(ranked);
    goTo('choose');
  }
}

/* ── SCORING ── */
function scoreAndRig(a) {
  const s = {};
  Object.keys(CITIES).forEach(c => s[c] = 0);
  const w=a.q0,pri=a.q1,nrg=a.q2,sty=a.q3,nyc=a.q4,vib=a.q5;

  if(w==='cold'){['Denver','Chicago'].forEach(c=>s[c]+=5);s['New York']+=3;['Nashville','Atlanta','New Orleans'].forEach(c=>s[c]-=2)}
  else if(w==='mild'){['Nashville','Atlanta'].forEach(c=>s[c]+=4);s['New Orleans']+=2;s['Denver']+=1}
  else{s['New Orleans']+=5;s['Atlanta']+=4;s['Nashville']+=3;['New York','Denver','Chicago'].forEach(c=>s[c]-=3)}

  if(pri==='food'){s['Chicago']+=4;s['New Orleans']+=3;s['Nashville']+=3;s['Atlanta']+=3;s['New York']+=2}
  else if(pri==='nightlife'){s['Nashville']+=5;s['New Orleans']+=3;s['New York']+=3;s['Atlanta']+=2;s['Chicago']+=2}
  else if(pri==='outdoors'){s['Denver']+=8;['Nashville','New York','Chicago','Atlanta','New Orleans'].forEach(c=>s[c]-=1)}
  else if(pri==='culture'){s['Chicago']+=6;s['New York']+=5;s['New Orleans']+=3;s['Atlanta']+=2}
  else if(pri==='music'){s['Nashville']+=7;s['New Orleans']+=4;s['Chicago']+=2;s['Atlanta']+=2}

  if(nrg==='packed'){['New York','Nashville','New Orleans'].forEach(c=>s[c]+=2)}
  else if(nrg==='balanced'){['Chicago','Denver'].forEach(c=>s[c]+=3);s['Atlanta']+=2}
  else{s['Denver']+=4;s['Atlanta']+=3;['New York','Nashville'].forEach(c=>s[c]-=2)}

  if(sty==='scenic'){s['Denver']+=5;s['Chicago']+=3;s['New York']+=2}
  else if(sty==='foodie'){s['Chicago']+=4;s['New Orleans']+=3;s['Nashville']+=3;s['Atlanta']+=2;s['New York']+=2}
  else if(sty==='social'){s['Nashville']+=4;s['Chicago']+=3;s['New Orleans']+=3;s['New York']+=3}
  else{s['Denver']+=4;s['Atlanta']+=3;['New York','Nashville'].forEach(c=>s[c]-=2)}

  if(nyc==='nyc_yes')s['New York']+=10;
  else if(nyc==='nyc_maybe'){s['New York']-=5;s['Chicago']+=3;s['Denver']+=2}
  else{s['New York']-=15;s['Denver']+=4;s['Chicago']+=3}

  if(vib==='bigcity'){s['Chicago']+=4;s['New York']+=3;s['Atlanta']+=2}
  else if(vib==='music_scene'){s['Nashville']+=5;s['New Orleans']+=4;s['Chicago']+=2}
  else if(vib==='nature')s['Denver']+=7;
  else{s['New Orleans']+=4;s['Nashville']+=3;s['Chicago']+=4;s['Atlanta']+=2;s['New York']+=2}

  return Object.entries(s).sort((a,b)=>b[1]-a[1]);
}

/* ── CHOOSE ── */
function buildChoose(ranked) {
  const grid = document.getElementById('choose-cities');
  grid.innerHTML = '';
  ranked.slice(0,2).forEach(([name]) => {
    const city = CITIES[name];
    const div = document.createElement('div');
    div.className = 'choose-city';
    div.innerHTML = `
      <img src="${city.photo}" alt="${name}" loading="lazy">
      <div class="choose-city-overlay">
        <div class="choose-city-name">${name}</div>
        <div class="choose-city-meta">${city.meta}</div>
        <div class="choose-city-btn"><span class="choose-city-btn-line"></span> pick this one</div>
      </div>
    `;
    div.onclick = () => showResult(name);
    grid.appendChild(div);
  });
}

/* ── RESULT ── */
function showResult(name) {
  const city = CITIES[name];
  document.getElementById('r-img').src = city.photo;
  document.getElementById('r-name').textContent = name;
  document.getElementById('r-meta').textContent = city.meta;
  document.getElementById('r-desc').textContent = city.desc;
  document.getElementById('r-why').textContent = city.why;
  document.getElementById('r-footer-city').textContent = name.toLowerCase();

  document.getElementById('r-tags').innerHTML = city.tags.map(t=>`<span class="result-tag">${t}</span>`).join('');

  const runners = document.getElementById('r-runners');
  runners.innerHTML = '';
  ranked.filter(([n])=>n!==name).slice(0,3).forEach(([n])=>{
    const c = CITIES[n];
    const row = document.createElement('div');
    row.className = 'runner-row';
    row.innerHTML = `<img class="runner-img" src="${c.thumb}" alt="${n}" loading="lazy"><div class="runner-info"><div class="runner-name">${n}</div><div class="runner-meta">${c.meta}</div></div>`;
    runners.appendChild(row);
  });

  document.getElementById('s-result').scrollTop = 0;
  goTo('result');
}
</script>
